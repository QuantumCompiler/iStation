name: CI

# Only for an open pull request (opened, new commits, reopened) and for a merge into stable;
# pushes to release branches run nothing (the user's call, 2026-10-31).
on:
  pull_request:
  push:
    branches: [stable]

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: src/istation
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Strict build (every import declared in the module map)
        run: swift build --explicit-target-dependency-import-check=error

      - name: Tests, including the layering and layer-context checks
        run: swift test

      - name: Docs validator
        working-directory: .
        run: python3 scripts/validate_docs.py documentation
