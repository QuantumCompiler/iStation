<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library at the minimum window size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Main" start="library-min" still="{{ true }}" hint-size="800px,560px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
