<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Early directions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="max-width:1360px;margin:0 auto;padding:48px 40px 64px;display:flex;flex-direction:column;gap:28px">
    <header style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:13px;font-weight:600;color:var(--accent-text);letter-spacing:0.04em;text-transform:uppercase">Exploration · kept for reference</div>
      <h1 style="margin:0;font-size:36px;line-height:1.15;font-family:var(--font-display)">Three directions, and why one won</h1>
      <p style="margin:0;max-width:900px;color:var(--fg-muted);font-size:16px;line-height:1.5">Sketched before the Build page. Superseded; nothing here is to be built.</p>
    </header>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:20px">
      <sc-for list="{{ directions }}" as="d" hint-placeholder-count="3">
        <article style="display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--bg-content)">
          <div style="display:flex;gap:8px;align-items:baseline"><h2 style="margin:0;font-size:20px;flex:1">{{ d.title }}</h2><span style="{{ d.verdictStyle }}">{{ d.verdict }}</span></div>
          <div role="img" aria-label="{{ d.sketchLabel }}" style="{{ d.frame }}">
            <sc-for list="{{ d.blocks }}" as="b" hint-placeholder-count="6"><span style="{{ b.style }}"><span style="font-size:10px;color:var(--fg-muted)">{{ b.text }}</span></span></sc-for>
          </div>
          <p style="margin:0;line-height:1.5">{{ d.idea }}</p>
          <p style="margin:0;line-height:1.5;color:var(--fg-muted)">{{ d.why }}</p>
        </article>
      </sc-for>
    </div>
    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:22px">Accent colors tried</h2>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:20px">
        <sc-for list="{{ accents }}" as="a" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg-content)">
            <div style="display:flex;gap:10px;align-items:center"><span style="{{ a.chip }}"></span><span style="font-weight:700">{{ a.name }}</span><span style="{{ a.verdictStyle }}">{{ a.verdict }}</span></div>
            <p style="margin:0;color:var(--fg-muted);line-height:1.5">{{ a.why }}</p>
          </div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>

function vars(theme) {
